server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json text/plain;

  location = /sw.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.woff2$ {
    default_type font/woff2;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(css|js|png|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
